[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gheymatyar"
version = "0.3.0"
description = "Pioneers Price Updater — backend API"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.3",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.10",
    "pymupdf==1.28.2",
    # Excel 97–2003 (BIFF8) export and its read-back check. Pure Python.
    "xlwt==1.3.0",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]
packaging = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
]

[project.scripts]
gheymatyar = "gheymatyar.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
